name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check && npm run check:pwa

      - name: Run unit tests
        run: npm test

      - name: Install browsers for quotation and compatibility checks
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run quotation layout checks
        run: npm run test:visual

      - name: Run cross-browser compatibility checks
        run: npm run test:compat

      - name: Run direct-source GitHub Pages smoke
        run: npm run test:source

      - name: Build production artifact
        run: npm run build

      - name: Run production artifact smoke
        run: npx playwright test --config=playwright.production.config.js

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
